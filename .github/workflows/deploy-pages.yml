name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check deployment credentials
        run: node -e "for (const key of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID']) if (!process.env[key]) throw new Error('Missing GitHub secret ' + key)"
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build:pages
      - run: npx wrangler pages deploy pages-dist --project-name=roamflight --branch=main
