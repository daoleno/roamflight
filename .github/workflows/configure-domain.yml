name: Configure Roamflight DNS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roamflight-dns
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify zone and configure only the Roamflight record
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_DNS_API_TOKEN;
          if (!token) throw new Error('Configure the CLOUDFLARE_DNS_API_TOKEN repository secret first.');
          const zoneId = 'c2a13e93f9cb1754c2c43ae76e8c7208';
          const name = 'roamflight.wooo.guru';
          const target = 'roamflight.pages.dev';
          async function api(path, method = 'GET', body) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              method,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
              throw new Error(`Cloudflare ${response.status}: ${data.errors?.map(e => e.message).join(', ')}`);
            }
            return data.result;
          }
          const zone = await api(`/zones/${zoneId}`);
          if (zone.name !== 'wooo.guru' || zone.status !== 'active') throw new Error('The expected zone is not active. No DNS changes made.');
          const path = `/zones/${zoneId}/dns_records`;
          const records = await api(`${path}?name=${encodeURIComponent(name)}`);
          if (records.length) {
            if (records.length !== 1 || records[0].type !== 'CNAME' || records[0].content.replace(/\.$/, '') !== target) {
              throw new Error('A conflicting record exists. Refusing to overwrite it.');
            }
            console.log('The expected CNAME already exists; no changes needed.');
          } else {
            await api(path, 'POST', { type: 'CNAME', name, content: target, proxied: true, ttl: 1, comment: 'Roamflight Cloudflare Pages' });
          }
          const verified = await api(`${path}?name=${encodeURIComponent(name)}`);
          if (!verified.some(r => r.type === 'CNAME' && r.content.replace(/\.$/, '') === target)) throw new Error('DNS verification failed.');
          console.log(`Verified ${name} -> ${target}. Certificate activation may take additional time.`);
          NODE
