<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title data-i18n="page.notFoundTitle">Not Found | Roamflight</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #153f60;
        color: #fff;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 30px;
        margin: 0;
      }
      a {
        color: #ffdd65;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <label
        ><span data-i18n="controls.language">Language</span>
        <select data-language-switch data-i18n-aria="controls.language" aria-label="Language">
          <option value="zh" lang="zh-CN">中文</option>
          <option value="en" lang="en">English</option>
        </select>
      </label>
      <h1 data-i18n="app.name">Roamflight</h1>
      <p data-i18n="page.notFound">This destination could not be found.</p>
      <a href="/" data-i18n="page.return">Return to flight</a>
    </main>
    <script type="module" src="/src/i18n.js"></script>
  </body>
</html>
